<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Авторизація</title>
    <style>
        body { font-family: sans-serif; padding: 40px; background: #f8fafc; }
        .box { background: white; padding: 30px; border-radius: 8px; width: 300px; margin: auto; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background: #4f46e5; color: white; border: none; padding: 10px; width: 100%; border-radius: 4px; cursor: pointer; }
        a { display: block; margin-top: 15px; color: #4f46e5; text-decoration: none; text-align: center; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Вхід у систему</h2>
        <input type="text" placeholder="Логин або Email">
        <input type="password" placeholder="Пароль">
        <button>Увійти</button>
        <a href="index.html">← Назад до UI Kit</a>
    </div>
</body>
</html>

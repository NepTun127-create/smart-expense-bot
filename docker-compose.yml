services:
  postgres:
    image: postgres:16-alpine
    container_name: smart-expense-db
    restart: unless-stopped
    environment:
      # Облікові дані беруться з `.env`; dev-значення нижче — лише для локальної
      # розробки. У production задайте сильний POSTGRES_PASSWORD.
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-smart_expense}
    ports:
      # БД доступна лише з localhost; не публікується у зовнішню мережу.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-smart_expense}
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
